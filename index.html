<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="My portfolio" />
    <!-- Optional: for a nice link preview when texted, edit these two lines by hand.
         (Link previews can't read content.js.) -->
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="My portfolio" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="techy.css" />
    <link rel="stylesheet" href="fancy.css" />
  </head>
  <body>
    <div id="error" class="error" role="alert" hidden></div>

    <button id="mode-toggle" class="mode-toggle" aria-label="Toggle dark mode" type="button">◐</button>

    <main id="app"></main>

    <noscript>This portfolio needs JavaScript turned on.</noscript>

    <!-- content.js is yours to edit. The rest is the engine and the three layouts; you don't need to touch them. -->
    <script src="content.js"></script>
    <script src="layout-classic.js"></script>
    <script src="layout-techy.js"></script>
    <script src="layout-fancy.js"></script>
    <script src="script.js"></script>
  </body>
</html>
